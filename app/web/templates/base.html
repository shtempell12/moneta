<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Монета{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
      --accent: #2f5bea; --accent-hover: #2449c4; --error-bg: #fdecec; --error: #b42318;
      --border: #e3e6ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .logo { font-weight: 700; font-size: 20px; color: var(--accent); text-decoration: none; }
    main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    }
    .narrow { max-width: 400px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
    input[type=email], input[type=password] {
      display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border); border-radius: 8px;
    }
    .checkbox { display: flex; gap: 8px; align-items: flex-start; color: var(--text); }
    .checkbox input { margin-top: 4px; }
    button {
      padding: 10px 18px; font-size: 16px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    button:hover { background: var(--accent-hover); }
    button.link { background: none; color: var(--muted); padding: 0; }
    button.link:hover { color: var(--text); }
    .error {
      background: var(--error-bg); color: var(--error); padding: 10px 12px;
      border-radius: 8px; margin-bottom: 16px;
    }
    .muted { color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    .tags li { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Монета</a>
    {% block header_right %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
